<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101010">
<title>FREE FIRE FOX | فری فایر فاکس</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;background:#101010;color:#fff;
 font-family:Tahoma,Arial,sans-serif;line-height:1.9
}
header{
 background:#191919;padding:15px;
 border-bottom:2px solid #ff7900;
 position:sticky;top:0;z-index:10
}
nav{
 max-width:1100px;margin:auto;display:flex;
 justify-content:space-between;align-items:center;gap:12px
}
.logo{font-size:21px;font-weight:bold;color:#ff7900}
nav a{color:#fff;text-decoration:none;font-size:13px}
nav a:hover{color:#ff7900}
.hero{
 text-align:center;padding:55px 15px;
 background:radial-gradient(ellipse at top,#572500,#101010 70%)
}
.fox{font-size:90px}
.hero h1{font-size:35px;color:#ff7900;margin:0}
.hero p{color:#ddd}
button,.btn{
 display:inline-block;background:#ff7900;color:#111;
 padding:12px 18px;border:0;border-radius:9px;
 font-weight:bold;cursor:pointer;text-decoration:none
}
.container{width:92%;max-width:1100px;margin:auto}
section{padding:30px 0}
.title{color:#ff7900;font-size:25px;text-align:center}
.grid{
 display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px
}
.card{
 background:#1d1d1d;border:1px solid #39302a;
 border-radius:15px;padding:20px;text-align:center
}
.card .icon{font-size:35px}
.card h3{color:#ff9b35}
.card p{color:#ccc;font-size:14px}
.card a{color:#ff9b35}
input,select{
 background:#101010;color:white;border:1px solid #ff7900;
 padding:12px;border-radius:8px;width:100%;margin:8px 0
}
.result{
 background:#302013;border-radius:10px;padding:15px;
 margin-top:15px;overflow-wrap:anywhere
}
.tip{text-align:right}
.tip
